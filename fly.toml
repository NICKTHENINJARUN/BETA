# fly.toml app configuration file generated for black-jack on 2026-09-21T06:55:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'black-jack'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/table.db'
  HOST = '0.0.0.0'
  PORT = '8080'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'table_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 220
    soft_limit = 180

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '30s'
    timeout = '4s'
    grace_period = '5s'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
