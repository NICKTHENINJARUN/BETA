# One app serves the whole site: the trainer at / and the table at /table.
#
# Fly is the default here for one reason: the accounts and balances live in a
# SQLite file, so the deployment needs a persistent disk. Several free tiers
# elsewhere give you a container with no durable storage, which would reset
# every account on each deploy. Hosts built around functions rather than
# processes are a worse fit still — the table keeps its own clock, and there is
# nothing alive between requests to notice that a betting window closed.
#
# Nothing below is Fly-specific except this file. The image is a plain
# Dockerfile, so moving to Railway, Render or anywhere else that mounts a
# volume is a config change rather than a port.

app = "black-jack"
primary_region = "dfw"          # Dallas — change to the region nearest your players

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  DB_PATH = "/data/table.db"
  TRUST_PROXY = "1"             # Fly terminates TLS, so the Secure cookie flag
                                # and the real client IP come from forwarded headers

[[mounts]]
  source = "table_data"         # created by: fly volumes create table_data --size 1
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine, deliberately. The table lives in this process's memory and the
  # ledger is a file on this machine's disk; a second instance would be a second
  # table with a second database, and players would silently be at different
  # tables. Scaling past one means moving the table state and the database out
  # of the process, which is a real piece of work and not needed yet.
  # Zero keeps the bill at nothing while nobody is playing, at the cost of a
  # cold start on the first visit after an idle spell. Set it to 1 once the
  # trainer is the front door and that first impression matters more than the
  # few dollars a month.
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    # Each watcher holds an open Server-Sent Events response for as long as they
    # are at the table, so the useful limit here is open connections, not
    # requests per second.
    soft_limit = 180
    hard_limit = 220

# Stated rather than left to the platform's default, which has changed before
# and decides the bill. Node plus a SQLite file sits well under this; the
# ceiling is here so a busy shoe cannot push the machine into the next size
# without anyone choosing it.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 8080
  path = "/healthz"
  interval = "30s"
  timeout = "4s"
  grace_period = "5s"
