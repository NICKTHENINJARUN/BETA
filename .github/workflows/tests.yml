# The app is a single static file with no build step, so there is nothing to
# compile here — the suites open index.html in a real browser and check what it
# actually does. Playwright is the only dependency and it is a test-time one.
name: tests

# A branch with an open pull request is already covered by the pull_request
# trigger, so an unscoped push trigger just runs the whole suite a second time
# on the same commit. Pushes matter here only for main, where they deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on main supersedes an in-flight deploy rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm ci, so the version is whatever package-lock.json pins and the browser
      # step below fetches the binary that matches it.
      - name: Install Playwright
        run: npm ci --no-audit --no-fund

      # Cache the browser binary rather than the package: it is the slow part,
      # and it is keyed to the Playwright version so a bump fetches a fresh one.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cached browser still needs its system libraries on a fresh runner.
      - name: Install browser system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Run as separate steps so a red build names the suite that broke
      # instead of making you read the log to find out.
      - name: Strategy engine
        run: node tests/test-engine.mjs

      - name: Jack
        run: node tests/test-jack.mjs

      - name: Bankroll accounting
        run: node tests/test-money.mjs

      # The table and the server need no browser, so they run before the slow
      # ones: a broken ledger should fail the build in seconds, not minutes.
      - name: Table
        run: node tests/test-table.mjs

      - name: Server
        run: node tests/test-server.mjs

      - name: Interface
        run: node tests/test-ui.mjs

      - name: Accessibility
        run: node tests/test-a11y.mjs

      # Statistical, and bounded by its own standard error rather than a
      # guessed tolerance. Slowest of the six at roughly 120M simulated rounds.
      - name: Simulation
        run: node tests/test-sim.mjs

  # Publish to GitHub Pages, but only from main and only once the suites above
  # have passed — a red build should never reach the live site.
  deploy:
    needs: test
    # workflow_dispatch is here so a deploy can be re-run by hand without an
    # empty commit — which is exactly what was needed the first time Pages was
    # switched on after this workflow already existed.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    # Scoped to this job: the test job needs no write access to anything.
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # The app is index.html and nothing else. Ship that alone rather than the
      # whole repository, so the tests, lockfile and README stay off the site.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          # Any unknown path serves the app, so a stale or mistyped link lands
          # on the page instead of a 404.
          cp index.html _site/404.html
          # Tells Pages to serve the files as-is instead of running Jekyll over
          # them, which would otherwise ignore anything starting with an underscore.
          touch _site/.nojekyll

      # No enablement flag: creating a Pages site needs repository admin, which
      # the workflow token does not have ("Resource not accessible by
      # integration"). Pages has to be switched on once by hand; after that
      # this step just reads the existing configuration.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
